    <div class="main-content">
        <div class="kiosco-card shadow-lg" id="marco-kiosco">
            <h2 class="mb-3">Control de Entrada</h2>
            <input type="text" id="idBusqueda" class="input-asistencia" placeholder="¿Quién eres?" autocomplete="off">
            <div id="msg-ok" class="alert-pantalla" style="display:none; background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 2px solid #22c55e; padding:15px; border-radius:15px; font-size:1.8rem; font-weight:bold;">
                <i class="bi bi-check-circle-fill"></i> BIENVENIDO<br><span id="nombre-socio" style="color:white;"></span>
            </div>
            <div id="msg-error" class="alert-pantalla" style="display:none; background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 2px solid #ef4444; padding:15px; border-radius:15px; font-size:1.8rem; font-weight:bold;">
                <i class="bi bi-x-circle-fill"></i> SOCIO NO ENCONTRADO
            </div>
        </div>
        <div id="lista-reciente" class="d-flex gap-2 mt-4 overflow-hidden"></div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs, addDoc, onSnapshot, doc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        onSnapshot(doc(db, "configuracion", "general"), (ds) => { if(ds.exists()) document.getElementById('gym-name-side').innerText = ds.data().nombre; });

        const input = document.getElementById('idBusqueda');
        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const busqueda = input.value.trim().toLowerCase();
                if(!busqueda) return;

                const snapshot = await getDocs(collection(db, "socios"));
                let socio = null;
                snapshot.forEach(d => { if(d.data().nombre.toLowerCase().includes(busqueda)) socio = d.data(); });

                const ok = document.getElementById('msg-ok');
                const err = document.getElementById('msg-error');
                const marco = document.getElementById('marco-kiosco');
                ok.style.display = err.style.display = 'none';

                if(socio) {
                    document.getElementById('nombre-socio').innerText = socio.nombre;
                    ok.style.display = 'block'; marco.style.borderColor = "#22c55e";
                    
                    const ahora = new Date();
                    const mesAnioTag = (ahora.getMonth() + 1) + "-" + ahora.getFullYear(); // Formato: 4-2024

                    await addDoc(collection(db, "asistencia"), {
                        nombre: socio.nombre,
                        hora: ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                        fechaSimple: ahora.toLocaleDateString(),
                        mesAnio: mesAnioTag, // ETIQUETA CLAVE
                        timestamp: ahora.toISOString()
                    });
                } else {
                    err.style.display = 'block'; marco.style.borderColor = "#ef4444";
                }
                setTimeout(() => { input.value = ""; marco.style.borderColor = "#334155"; ok.style.display = err.style.display = 'none'; input.focus(); }, 3000);
            }
        });

        // Historial rápido (Últimos 5)
        onSnapshot(query(collection(db, "asistencia"), orderBy("timestamp", "desc"), limit(5)), (snap) => {
            const lista = document.getElementById('lista-reciente'); lista.innerHTML = "";
            snap.forEach(d => {
                lista.innerHTML += `<div class="p-2 border border-secondary rounded bg-dark text-center" style="min-width:110px;"><div class="small fw-bold text-truncate">${d.data().nombre}</div><div class="text-success small">${d.data().hora}</div></div>`;
            });
        });
    </script>
    <!-- COPIA DESDE AQUÍ -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Leemos qué usuario entró (master, propietario o admin)
            const rol = localStorage.getItem('rol');

            // 2. Localizamos los botones en el menú
            const btnConfig = document.getElementById('btn-config');
            const btnInformes = document.getElementById('btn-informes');

            // 3. REGLAS DE PODER
            if (rol === 'master') {
                // TÚ: Ves todo. Forzamos a que se muestren.
                if (btnConfig) btnConfig.style.display = 'block';
                if (btnInformes) btnInformes.style.display = 'block';
            } 
            else if (rol === 'propietario') {
                // DUEÑO GYM: Ve informes, pero ocultamos configuración
                if (btnConfig) btnConfig.style.display = 'none';
                if (btnInformes) btnInformes.style.display = 'block';
            } 
            else {
                // RECEPCIONISTA (admin): Ocultamos los dos botones delicados
                if (btnConfig) btnConfig.style.display = 'none';
                if (btnInformes) btnInformes.style.display = 'none';
            }
        });
    </script>
