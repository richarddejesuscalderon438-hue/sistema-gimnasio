<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia - Jean Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #f97316; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; overflow: hidden; }
        .sidebar { width: 260px; height: 100vh; background: var(--card-dark); position: fixed; border-right: 1px solid #334155; z-index: 100; }
        .nav-link { color: #94a3b8; padding: 15px 25px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { background: #334155; color: var(--accent); border-left: 4px solid var(--accent); }
        .main-content { margin-left: 260px; padding: 30px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .kiosco-card { background: var(--card-dark); padding: 40px; border-radius: 30px; border: 3px solid #334155; width: 100%; max-width: 600px; text-align: center; }
        .input-asistencia { background: #0f172a; border: 2px solid #475569; color: white; font-size: 2.5rem; text-align: center; border-radius: 20px; width: 100%; padding: 10px; margin-bottom: 20px; }
        .alert-pantalla { display: none; font-size: 1.8rem; font-weight: bold; padding: 15px; border-radius: 15px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="sidebar flex-column">
        <div class="p-4 text-center border-bottom border-secondary"><h4 id="gym-name-side" style="color: var(--accent); font-weight: bold;">GYM MASTER</h4></div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link" href="panel.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a class="nav-link" href="miembros.html"><i class="bi bi-people me-2"></i> Miembros</a>
            <a class="nav-link" href="pagos.html"><i class="bi bi-cash-stack me-2"></i> Caja y Pagos</a>
            <a class="nav-link active" href="asistencia.html"><i class="bi bi-calendar-check me-2"></i> Asistencia</a>
            <a class="nav-link" href="inventario.html"><i class="bi bi-box-seam me-2"></i> Inventario</a>
            <a class="nav-link" id="btn-informes" href="informes.html"><i class="bi bi-graph-up me-2"></i> Informes</a>
            <a class="nav-link text-danger mt-5" href="index.html"><i class="bi bi-box-arrow-left me-2"></i> Salir</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="kiosco-card shadow-lg" id="marco-kiosco">
            <h2 class="mb-3">Control de Entrada</h2>
            <p class="text-secondary">Escribe tu nombre y presiona ENTER</p>
            <input type="text" id="idBusqueda" class="input-asistencia" placeholder="¿Quién eres?" autocomplete="off">
            
            <div id="msg-ok" class="alert-pantalla" style="background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 2px solid #22c55e;">
                <i class="bi bi-check-circle-fill"></i> BIENVENIDO<br><span id="nombre-socio" style="color:white;"></span>
            </div>
            
            <div id="msg-error" class="alert-pantalla" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 2px solid #ef4444;">
                <i class="bi bi-x-circle-fill"></i> SOCIO NO ENCONTRADO
            </div>
        </div>
        <div id="lista-reciente" class="d-flex gap-2 mt-4"></div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs, addDoc, onSnapshot, doc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. Sincronizar nombre del gym
        onSnapshot(doc(db, "configuracion", "general"), (ds) => { if(ds.exists()) document.getElementById('gym-name-side').innerText = ds.data().nombre; });

        const input = document.getElementById('idBusqueda');
        
        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const busqueda = input.value.trim().toLowerCase();
                if(!busqueda) return;

                const snapshot = await getDocs(collection(db, "socios"));
                let socioEncontrado = null;

                snapshot.forEach(d => {
                    if(d.data().nombre.toLowerCase().includes(busqueda)) {
                        socioEncontrado = d.data();
                    }
                });

                const msgOk = document.getElementById('msg-ok');
                const msgErr = document.getElementById('msg-error');
                const marco = document.getElementById('marco-kiosco');

                msgOk.style.display = msgErr.style.display = 'none';

                if(socioEncontrado) {
                    document.getElementById('nombre-socio').innerText = socioEncontrado.nombre;
                    msgOk.style.display = 'block';
                    marco.style.borderColor = "#22c55e";

                    // GUARDAR REGISTRO EN FIREBASE
                    const ahora = new Date();
                    await addDoc(collection(db, "asistencia"), {
                        nombre: socioEncontrado.nombre,
                        hora: ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                        fechaSimple: ahora.toLocaleDateString(), // Clave para el reinicio de 24h
                        mesAnio: (ahora.getMonth() + 1) + "/" + ahora.getFullYear(),
                        timestamp: ahora.toISOString()
                    });
                } else {
                    msgErr.style.display = 'block';
                    marco.style.borderColor = "#ef4444";
                }

                setTimeout(() => {
                    input.value = "";
                    marco.style.borderColor = "#334155";
                    msgOk.style.display = msgErr.style.display = 'none';
                    input.focus();
                }, 3000);
            }
        });

        // Ver últimos 5 ingresos
        const q = query(collection(db, "asistencia"), orderBy("timestamp", "desc"), limit(5));
        onSnapshot(q, (snap) => {
            const lista = document.getElementById('lista-reciente');
            lista.innerHTML = "";
            snap.forEach(d => {
                lista.innerHTML += `<div class="p-2 border border-secondary rounded bg-dark text-center" style="min-width:110px;">
                    <div class="small fw-bold text-truncate">${d.data().nombre}</div>
                    <div class="text-success small">${d.data().hora}</div>
                </div>`;
            });
        });
    </script>
</body>
</html>
