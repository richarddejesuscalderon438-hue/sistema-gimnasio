<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja - Gym Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #f97316; --success: #22c55e; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; margin: 0; }
        .sidebar { width: 260px; height: 100vh; background: var(--card-dark); position: fixed; border-right: 1px solid #334155; z-index: 100; }
        .nav-link { color: #94a3b8; padding: 15px 25px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { background: #334155; color: var(--accent); border-left: 4px solid var(--accent); }
        .main-content { margin-left: 260px; padding: 30px; }
        .card-pay { background: var(--card-dark); border-radius: 15px; border: 1px solid #334155; padding: 25px; }
        .form-control, .form-select { background: #0f172a; border: 1px solid #334155; color: white; }
        .btn-cierre { background: #dc3545; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 10px; width: 100%; margin-top: 15px; transition: 0.3s; }
        .btn-cierre:hover { background: #bb2d3b; transform: scale(1.02); }
        @media print { body * { visibility: hidden; } #ticket-impresion, #ticket-impresion * { visibility: visible !important; display: block !important; color: black !important; } #ticket-impresion { position: absolute; left: 0; top: 0; width: 100%; text-align: center; background: white; font-family: monospace; } }
    </style>
</head>
<body>
    <div class="sidebar flex-column shadow">
        <div class="p-4 text-center border-bottom border-secondary"><h4 id="gym-name-side" style="color: var(--accent); font-weight: bold;">GYM MASTER</h4></div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link" href="panel.html">Dashboard</a>
            <a class="nav-link" href="miembros.html">Miembros</a>
            <a class="nav-link active" href="pagos.html">Caja y Pagos</a>
            <a class="nav-link" href="asistencia.html">Asistencia</a>
            <a class="nav-link" href="inventario.html">Inventario</a>
            <a class="nav-link" id="btn-informes" href="informes.html">Informes</a>
            <a class="nav-link text-danger mt-5" href="index.html">Salir</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="row mb-4 align-items-center">
            <div class="col-md-8"><h2>Caja del Turno</h2><p class="text-secondary">Registro de cobros y cierre de caja.</p></div>
            <div class="col-md-4 text-end">
                <div class="card-pay border-success shadow-lg text-center">
                    <small class="text-secondary d-block fw-bold small">TOTAL EN CAJA AHORA</small>
                    <h2 class="text-success fw-bold mb-0" id="total-hoy">$0.00</h2>
                    <button class="btn-cierre" onclick="cerrarTurnoCloud()"><i class="bi bi-lock-fill me-2"></i> CERRAR TURNO (REINICIAR)</button>
                </div>
            </div>
        </div>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card-pay shadow">
                    <h5 class="mb-4 text-warning">Nuevo Cobro</h5>
                    <form id="formPago">
                        <div class="mb-3"><label class="small text-secondary">CLIENTE</label><input type="text" id="clientePago" class="form-control" required></div>
                        <div class="mb-3"><label class="small text-secondary">CONCEPTO</label><select id="conceptoPago" class="form-select"><option value="Mensualidad">Mensualidad</option><option value="Pase Diario">Pase Diario</option></select></div>
                        <div class="mb-4"><label class="small text-secondary">MONTO ($)</label><input type="number" id="montoPago" class="form-control fs-4 text-success fw-bold" value="5.00" step="0.01"></div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">PROCESAR Y RECIBO</button>
                    </form>
                </div>
            </div>
            <div class="col-md-8"><div class="card-pay shadow"><h5>Movimientos del Turno</h5><table class="table table-dark table-hover mt-3"><thead><tr class="small text-secondary"><th>Hora</th><th>Concepto</th><th>Monto</th><th></th></tr></thead><tbody id="lista-pagos"></tbody></table></div></div>
        </div>
    </div>

    <div id="ticket-impresion" style="display: none;">
        <h2 id="t-gym-name">GYM MASTER</h2><hr>
        <div style="text-align:left; padding: 10px;"><p>FECHA: <span id="t-fecha"></span></p><p>CLIENTE: <span id="t-cliente"></span></p><p>TOTAL: $<span id="t-total"></span></p></div><hr>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        onSnapshot(doc(db, "configuracion", "general"), (ds) => { 
            if(ds.exists()) { document.getElementById('gym-name-side').innerText = ds.data().nombre; document.getElementById('t-gym-name').innerText = ds.data().nombre; }
        });

        const q = query(collection(db, "pagos"), orderBy("fechaCompleta", "desc"));
        onSnapshot(q, (snap) => {
            const tabla = document.getElementById('lista-pagos');
            const totalVisor = document.getElementById('total-hoy');
            tabla.innerHTML = ""; let suma = 0;
            snap.forEach((p) => {
                const d = p.data(); suma += d.monto;
                tabla.innerHTML += `<tr><td>${d.hora}</td><td>${d.concepto}</td><td class="text-success">$${d.monto.toFixed(2)}</td><td><button class="btn btn-sm text-danger" onclick="borrarPagoCloud('${p.id}')">X</button></td></tr>`;
            });
            totalVisor.innerText = `$${suma.toFixed(2)}`;
        });

        document.getElementById('formPago').onsubmit = async (e) => {
            e.preventDefault();
            const pago = { hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), fechaCompleta: new Date().toISOString(), concepto: document.getElementById('conceptoPago').value, cliente: document.getElementById('clientePago').value, monto: parseFloat(document.getElementById('montoPago').value) };
            await addDoc(collection(db, "pagos"), pago);
            imprimirRecibo(pago);
            document.getElementById('clientePago').value = "";
        };

        window.cerrarTurnoCloud = async function() {
            const montoFinal = document.getElementById('total-hoy').innerText;
            if(confirm(`¿Cerrar turno con ${montoFinal}? Se reiniciará la caja.`)) {
                try {
                    await addDoc(collection(db, "cierres_caja"), {
                        fecha: new Date().toLocaleString(),
                        monto: montoFinal,
                        usuario: localStorage.getItem('usuario_nombre') || 'Empleado',
                        timestamp: new Date().getTime()
                    });
                    const snap = await getDocs(collection(db, "pagos"));
                    const batch = writeBatch(db);
                    snap.forEach((doc) => batch.delete(doc.ref));
                    await batch.commit();
                    alert("Cierre exitoso");
                    location.href = "index.html";
                } catch (e) { alert(e.message); }
            }
        };

        window.borrarPagoCloud = async (id) => { if(confirm("¿Borrar?")) await deleteDoc(doc(db, "pagos", id)); };
        function imprimirRecibo(p) { 
            document.getElementById('t-fecha').innerText = new Date().toLocaleString();
            document.getElementById('t-cliente').innerText = p.cliente;
            document.getElementById('t-total').innerText = p.monto.toFixed(2);
            setTimeout(() => { window.print(); }, 500); 
        }
    </script>
</body>
</html>
