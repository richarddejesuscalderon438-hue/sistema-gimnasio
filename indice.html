<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Master - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-image: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop'); background-size: cover; height: 100vh; display: flex; align-items: center; justify-content: center; color: white; font-family: sans-serif; }
        .login-card { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
        .btn-gym { background: #f97316; color: white; border: none; padding: 12px; font-weight: bold; width: 100%; border-radius: 10px; margin-top: 20px; transition: 0.3s; }
        .btn-gym:hover { background: #ea580c; transform: translateY(-2px); }
        .form-control { background: rgba(15, 23, 42, 0.5); border: 1px solid #334155; color: white; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 style="color: #f97316;">🏋️‍♂️ GYM MASTER</h2>
        <p style="color: #94a3b8;">Ingresa al sistema</p>
        
        <!-- IMPORTANTE: El onsubmit debe estar aquí -->
        <form onsubmit="return iniciarSesion(event)">
            <div class="text-start mb-3">
                <label class="form-label small fw-bold">USUARIO</label>
                <!-- IMPORTANTE: id="inputUsuario" -->
                <input type="text" id="inputUsuario" class="form-control" placeholder="master / propietario / admin" required>
            </div>
            <div class="text-start mb-3">
                <label class="form-label small fw-bold">CONTRASEÑA</label>
                <!-- IMPORTANTE: id="inputPassword" -->
                <input type="password" id="inputPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-gym text-uppercase">Entrar</button>
        </form>
    </div>

<script>
    function iniciarSesion(event) {
        event.preventDefault();

        // 1. Capturamos lo que el usuario escribió
        const userEscrito = document.getElementById('inputUsuario').value.trim().toLowerCase();
        const passEscrita = document.getElementById('inputPassword').value.trim();

        // 2. REGLA DE ORO: El usuario "MASTER" siempre funciona (Llave de emergencia)
        if(userEscrito === "master" && passEscrita === "12345") {
            localStorage.setItem('rol', 'master');
            window.location.href = "panel.html";
            return false;
        }

        // 3. BUSCAR EN LA MEMORIA (Usuarios creados en Configuración)
        // Buscamos en la lista 'system_users' que creamos en la otra pantalla
        const usuariosRegistrados = JSON.parse(localStorage.getItem('system_users')) || [];
        
        // Intentamos encontrar uno que coincida el nombre y la clave
        const usuarioEncontrado = usuariosRegistrados.find(u => 
            u.user.toLowerCase() === userEscrito && u.pass === passEscrita
        );

        if(usuarioEncontrado) {
            // ¡LO ENCONTRAMOS! Guardamos su rol y entramos
            localStorage.setItem('rol', usuarioEncontrado.rol);
            window.location.href = "panel.html";
        } else {
            // 4. Si no es master ni está en la lista...
            alert("❌ ERROR: Usuario o contraseña incorrectos.\nVerifica si lo creaste correctamente en Configuración.");
        }

        return false;
    }
</script>

</body>
</html>
