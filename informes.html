<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informes - Gym Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #f97316; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; margin: 0; }
        .sidebar { width: 260px; height: 100vh; background: var(--card-dark); position: fixed; border-right: 1px solid #334155; z-index: 100; }
        .nav-link { color: #94a3b8; padding: 15px 25px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { background: #334155; color: var(--accent); border-left: 4px solid var(--accent); }
        .main-content { margin-left: 260px; padding: 30px; }
        .card-report { background: var(--card-dark); border-radius: 15px; padding: 20px; border: 1px solid #334155; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="sidebar flex-column shadow">
        <div class="p-4 text-center border-bottom border-secondary"><h4 id="gym-name-side" style="color: var(--accent); font-weight: bold;">GYM MASTER</h4></div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link" href="panel.html">Dashboard</a>
            <a class="nav-link" href="miembros.html">Miembros</a>
            <a class="nav-link" href="pagos.html">Caja y Pagos</a>
            <a class="nav-link" href="asistencia.html">Asistencia</a>
            <a class="nav-link" href="inventario.html">Inventario</a>
            <a class="nav-link active" href="informes.html">Informes</a>
            <a class="nav-link text-danger mt-5" href="index.html">Salir</a>
        </nav>
    </div>

    <div class="main-content">
        <h3 class="mb-4 text-warning">Reportes del Mes</h3>
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card-report border-info">
                    <h5 class="text-info"><i class="bi bi-person-check"></i> Frecuencia de Socios</h5>
                    <table class="table table-dark table-sm mt-3">
                        <thead><tr><th>Socio</th><th>Visitas</th></tr></thead>
                        <tbody id="lista-frecuencia"></tbody>
                    </table>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card-report border-success">
                    <h5 class="text-success"><i class="bi bi-cash-coin"></i> Historial de Cierres de Turno</h5>
                    <table class="table table-dark table-sm mt-3">
                        <thead><tr><th>Fecha</th><th>Usuario</th><th>Total</th></tr></thead>
                        <tbody id="lista-cierres"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot, query, orderBy, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        onSnapshot(doc(db, "configuracion", "general"), (ds) => { if(ds.exists()) document.getElementById('gym-name-side').innerText = ds.data().nombre; });

        // 1. CARGAR CIERRES (ORDENADO)
        const qCierres = query(collection(db, "cierres_caja"), orderBy("timestamp", "desc"));
        onSnapshot(qCierres, (snap) => {
            const lista = document.getElementById('lista-cierres'); lista.innerHTML = "";
            snap.forEach(d => {
                const c = d.data();
                lista.innerHTML += `<tr><td>${c.fecha}</td><td class="text-info">${c.usuario}</td><td class="text-success fw-bold">${c.monto}</td></tr>`;
            });
        });

        // 2. FRECUENCIA DE SOCIOS
        const mesActual = (new Date().getMonth() + 1) + "-" + new Date().getFullYear();
        onSnapshot(collection(db, "asistencia"), (snap) => {
            const conteo = {};
            snap.forEach(d => { if (d.data().mesAnio === mesActual) { conteo[d.data().nombre] = (conteo[d.data().nombre] || 0) + 1; } });
            const tablaF = document.getElementById('lista-frecuencia'); tablaF.innerHTML = "";
            const listaOrdenada = Object.entries(conteo).sort((a, b) => b[1] - a[1]);
            listaOrdenada.forEach(([nombre, visitas]) => {
                tablaF.innerHTML += `<tr><td>${nombre}</td><td class="fw-bold text-info">${visitas} visitas</td></tr>`;
            });
        });
    </script>
</body>
</html>
