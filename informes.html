<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Informes - Gym Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #f97316; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; margin: 0; }
        .sidebar { width: 260px; height: 100vh; background: var(--card-dark); position: fixed; border-right: 1px solid #334155; z-index: 100; }
        .nav-link { color: #94a3b8; padding: 15px 25px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { background: #334155; color: var(--accent); border-left: 4px solid var(--accent); }
        .main-content { margin-left: 260px; padding: 30px; }
        .card-report { background: var(--card-dark); border-radius: 15px; padding: 20px; border: 1px solid #334155; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="sidebar flex-column shadow">
        <div class="p-4 text-center border-bottom border-secondary"><h4 id="gym-name-side" style="color: var(--accent); font-weight: bold;">GYM MASTER</h4></div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link" href="panel.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a class="nav-link" href="miembros.html"><i class="bi bi-people me-2"></i> Miembros</a>
            <a class="nav-link" href="pagos.html"><i class="bi bi-cash-stack me-2"></i> Caja y Pagos</a>
            <a class="nav-link" href="asistencia.html"><i class="bi bi-calendar-check me-2"></i> Asistencia</a>
            <a class="nav-link active" href="informes.html"><i class="bi bi-graph-up me-2"></i> Informes</a>
            <a class="nav-link text-danger mt-5" href="index.html"><i class="bi bi-box-arrow-left me-2"></i> Salir</a>
        </nav>
    </div>

    <div class="main-content">
        <h3 class="mb-4 text-warning">Reportes y Auditoría</h3>
        
        <div class="row">
            <!-- TABLA DE CIERRES -->
            <div class="col-md-6">
                <div class="card-report border-success">
                    <h5 class="text-success"><i class="bi bi-cash"></i> Cierres de Turno</h5>
                    <table class="table table-dark table-sm mt-3">
                        <thead><tr><th>Fecha</th><th>Usuario</th><th>Total</th></tr></thead>
                        <tbody id="lista-cierres"></tbody>
                    </table>
                </div>
            </div>

            <!-- TABLA DE FRECUENCIA (LA QUE PEDISTE) -->
            <div class="col-md-6">
                <div class="card-report border-info">
                    <h5 class="text-info"><i class="bi bi-person-check"></i> Visitas este Mes</h5>
                    <p class="small text-secondary">Veces que cada socio ha entrenado este mes.</p>
                    <table class="table table-dark table-sm mt-3">
                        <thead><tr><th>Socio</th><th>Visitas</th></tr></thead>
                        <tbody id="lista-frecuencia"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot, query, orderBy, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        onSnapshot(doc(db, "configuracion", "general"), (ds) => { if(ds.exists()) document.getElementById('gym-name-side').innerText = ds.data().nombre; });

        // 1. CARGAR CIERRES
        onSnapshot(query(collection(db, "cierres_caja"), orderBy("fecha", "desc")), (snap) => {
            const lista = document.getElementById('lista-cierres'); lista.innerHTML = "";
            snap.forEach(d => {
                const c = d.data();
                lista.innerHTML += `<tr><td>${c.fecha.split(',')[0]}</td><td>${c.usuario}</td><td class="text-success">${c.monto}</td></tr>`;
            });
        });

        // 2. LÓGICA DE FRECUENCIA MENSUAL
        const mesActual = (new Date().getMonth() + 1) + "/" + new Date().getFullYear();
        onSnapshot(collection(db, "asistencia"), (snap) => {
            const frecuencia = {};
            snap.forEach(d => {
                const data = d.data();
                if(data.mesAnio === mesActual) {
                    frecuencia[data.nombre] = (frecuencia[data.nombre] || 0) + 1;
                }
            });

            const tablaF = document.getElementById('lista-frecuencia'); tablaF.innerHTML = "";
            for (const [nombre, conteo] of Object.entries(frecuencia)) {
                tablaF.innerHTML += `<tr><td>${nombre}</td><td class="fw-bold text-info">${conteo} asistencias</td></tr>`;
            }
        });
    </script>
</body>
</html>
