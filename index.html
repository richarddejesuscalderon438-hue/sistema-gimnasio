<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gym Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-image: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop'); background-size: cover; height: 100vh; display: flex; align-items: center; justify-content: center; color: white; font-family: sans-serif; }
        .login-card { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
        .btn-gym { background: #f97316; color: white; border: none; padding: 12px; font-weight: bold; width: 100%; border-radius: 10px; margin-top: 20px; }
        .form-control { background: rgba(15, 23, 42, 0.5); border: 1px solid #334155; color: white; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 style="color: #f97316;">🏋️‍♂️ GYM MASTER</h2>
        <p style="color: #94a3b8;">Ingreso al Sistema</p>
        <form onsubmit="iniciarSesion(event)">
            <div class="text-start mb-3">
                <label class="form-label small">USUARIO</label>
                <input type="text" id="inputUsuario" class="form-control" required>
            </div>
            <div class="text-start mb-3">
                <label class="form-label small">CONTRASEÑA</label>
                <input type="password" id="inputPassword" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-gym">ENTRAR</button>
        </form>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        window.iniciarSesion = async function(event) {
            event.preventDefault();
            const user = document.getElementById('inputUsuario').value.trim().toLowerCase();
            const pass = document.getElementById('inputPassword').value.trim();

            // 1. ACCESO MASTER (TÚ)
            if(user === "master" && pass === "12345") {
                localStorage.setItem('rol', 'master');
                localStorage.setItem('usuario_nombre', 'Richard Master');
                window.location.href = "panel.html";
                return;
            }

            // 2. BUSCAR OTROS USUARIOS EN NUBE
            try {
                const snap = await getDocs(collection(db, "system_users"));
                let encontrado = null;
                snap.forEach(doc => {
                    const d = doc.data();
                    if(d.user === user && d.pass === pass) encontrado = d;
                });

                if(encontrado) {
                    localStorage.setItem('rol', encontrado.rol);
                    localStorage.setItem('usuario_nombre', encontrado.user);
                    window.location.href = "panel.html";
                } else {
                    alert("❌ Credenciales incorrectas");
                }
            } catch (e) { alert("Error de conexión"); }
        }
    </script>
</body>
</html>
