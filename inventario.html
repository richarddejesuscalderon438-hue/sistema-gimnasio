<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario y Tienda - Gym Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #f97316; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; }
        .sidebar { width: 260px; height: 100vh; background: var(--card-dark); position: fixed; border-right: 1px solid #334155; }
        .nav-link { color: #94a3b8; padding: 15px 25px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { background: #334155; color: var(--accent); border-left: 4px solid var(--accent); }
        .main-content { margin-left: 260px; padding: 30px; }
        .product-card { background: var(--card-dark); border: 1px solid #334155; border-radius: 15px; cursor: pointer; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .cart-panel { background: var(--card-dark); border-radius: 20px; padding: 20px; border: 1px solid #475569; position: sticky; top: 20px; }
    </style>
</head>
<body>

    <div class="sidebar flex-column">
        <div class="p-4 text-center border-bottom border-secondary"><h4 style="color: var(--accent); font-weight: bold;">🏋️‍♂️ GYM MASTER</h4></div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link" href="panel.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a class="nav-link" href="miembros.html"><i class="bi bi-people me-2"></i> Miembros</a>
            <a class="nav-link" href="pagos.html"><i class="bi bi-cash-stack me-2"></i> Caja y Pagos</a>
            <a class="nav-link active" href="inventario.html"><i class="bi bi-box-seam me-2"></i> Inventario / Tienda</a>
            <a class="nav-link text-danger mt-5" href="índice.html"><i class="bi bi-box-arrow-left me-2"></i> Salir</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between mb-4">
            <h2>Tienda de Suplementos</h2>
            <button class="btn btn-warning fw-bold" data-bs-toggle="modal" data-bs-target="#modalProducto">NUEVO PRODUCTO</button>
        </div>

        <div class="row">
            <!-- CATÁLOGO -->
            <div class="col-md-8">
                <div class="row g-3" id="contenedor-productos">
                    <!-- Los productos se cargan aquí desde JavaScript -->
                </div>
            </div>

            <!-- CARRITO -->
            <div class="col-md-4">
                <div class="cart-panel shadow">
                    <h5 class="mb-4 border-bottom pb-2 text-warning"><i class="bi bi-cart3"></i> Venta Actual</h5>
                    <div id="lista-carrito" style="min-height: 100px;">
                        <p class="text-secondary text-center">Seleccione productos...</p>
                    </div>
                    <hr class="border-secondary">
                    <div class="d-flex justify-content-between mb-3 fs-4 fw-bold">
                        <span>TOTAL:</span>
                        <span id="total-venta" class="text-success">$0.00</span>
                    </div>
                    <button class="btn btn-success w-100 py-3 fw-bold shadow" onclick="procesarVentaTienda()">
                        COBRAR Y DESCONTAR STOCK
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVO PRODUCTO -->
    <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content bg-dark border-secondary"><div class="modal-body">
            <h5 class="text-warning mb-3">Agregar al Almacén</h5>
            <form id="formProducto">
                <div class="mb-3"><label class="small text-secondary">NOMBRE</label><input type="text" id="pNombre" class="form-control bg-secondary text-white border-0" required></div>
                <div class="row"><div class="col"><label class="small text-secondary">PRECIO VENTA</label><input type="number" id="pPrecio" class="form-control bg-secondary text-white border-0" step="0.01" required></div>
                <div class="col"><label class="small text-secondary">STOCK INICIAL</label><input type="number" id="pStock" class="form-control bg-secondary text-white border-0" required></div></div>
                <button type="submit" class="btn btn-warning w-100 mt-4 fw-bold">GUARDAR PRODUCTO</button>
            </form>
        </div></div></div>
    </div>

    <script>
        let carrito = [];

        // 1. CARGAR PRODUCTOS INICIALES SI NO EXISTEN
        function inicializarProductos() {
            if (!localStorage.getItem('productos')) {
                const iniciales = [
                    { id: 1, nombre: "Agua Mineral", precio: 1.50, stock: 20, icono: "💧" },
                    { id: 2, nombre: "Proteína Whey", precio: 45.00, stock: 5, icono: "🧪" },
                    { id: 3, nombre: "Bebida Energética", precio: 2.50, stock: 15, icono: "⚡" }
                ];
                localStorage.setItem('productos', JSON.stringify(iniciales));
            }
            renderizarCatalogo();
        }

        // 2. MOSTRAR CATÁLOGO
        function renderizarCatalogo() {
            const productos = JSON.parse(localStorage.getItem('productos'));
            const contenedor = document.getElementById('contenedor-productos');
            contenedor.innerHTML = "";

            productos.forEach(p => {
                const agotado = p.stock <= 0;
                contenedor.innerHTML += `
                    <div class="col-md-4">
                        <div class="product-card p-3 text-center ${agotado ? 'opacity-50' : ''}" 
                             onclick="${agotado ? '' : `agregarAlCarrito(${p.id})`}">
                            <div style="font-size: 2.5rem;">${p.icono || '📦'}</div>
                            <h6 class="mt-2 mb-1">${p.nombre}</h6>
                            <p class="text-warning fw-bold mb-0">$${p.precio.toFixed(2)}</p>
                            <small class="${agotado ? 'text-danger fw-bold' : 'text-secondary'}">
                                ${agotado ? 'AGOTADO' : `Stock: ${p.stock}`}
                            </small>
                        </div>
                    </div>
                `;
            });
        }

        // 3. LÓGICA DEL CARRITO
        function agregarAlCarrito(id) {
            const productos = JSON.parse(localStorage.getItem('productos'));
            const producto = productos.find(p => p.id === id);
            carrito.push(producto);
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const lista = document.getElementById('lista-carrito');
            const visorTotal = document.getElementById('total-venta');
            lista.innerHTML = "";
            let total = 0;

            carrito.forEach(item => {
                total += item.precio;
                lista.innerHTML += `<div class="d-flex justify-content-between border-bottom border-secondary py-2">
                    <span>${item.nombre}</span><span>$${item.precio.toFixed(2)}</span>
                </div>`;
            });
            visorTotal.innerText = `$${total.toFixed(2)}`;
        }

        // 4. PROCESAR VENTA (LA PARTE MÁS IMPORTANTE)
        function procesarVentaTienda() {
            if (carrito.length === 0) return alert("El carrito está vacío");

            let productos = JSON.parse(localStorage.getItem('productos'));
            let pagos = JSON.parse(localStorage.getItem('pagos')) || [];
            let totalVenta = 0;

            // Restar stock y sumar total
            carrito.forEach(itemCarrito => {
                const pIndex = productos.findIndex(p => p.id === itemCarrito.id);
                if (productos[pIndex].stock > 0) {
                    productos[pIndex].stock -= 1;
                    totalVenta += itemCarrito.precio;
                }
            });

            // Registrar en la CAJA (pagos.html)
            const nuevoPago = {
                hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                concepto: "Venta Tienda: " + carrito.map(c => c.nombre).join(", "),
                cliente: "Venta de Mostrador",
                monto: totalVenta
            };
            pagos.unshift(nuevoPago);

            // Guardar todo
            localStorage.setItem('productos', JSON.stringify(productos));
            localStorage.setItem('pagos', JSON.stringify(pagos));

            alert("Venta procesada con éxito. Stock actualizado.");
            carrito = [];
            actualizarCarritoUI();
            renderizarCatalogo();
        }

        // 5. AGREGAR NUEVOS PRODUCTOS
        document.getElementById('formProducto').onsubmit = function(e) {
            e.preventDefault();
            const productos = JSON.parse(localStorage.getItem('productos'));
            const nuevo = {
                id: Date.now(),
                nombre: document.getElementById('pNombre').value,
                precio: parseFloat(document.getElementById('pPrecio').value),
                stock: parseInt(document.getElementById('pStock').value),
                icono: "📦"
            };
            productos.push(nuevo);
            localStorage.setItem('productos', JSON.stringify(productos));
            location.reload();
        };

        document.addEventListener("DOMContentLoaded", inicializarProductos);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const config = JSON.parse(localStorage.getItem('gym_config')) || { name: "GYM MASTER" };
        const sideName = document.getElementById('gym-name-side');
        if(sideName) sideName.innerText = config.name;
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 1. Buscamos la configuración guardada
        const config = JSON.parse(localStorage.getItem('gym_config')) || { name: "GYM MASTER" };
        
        // 2. Buscamos el elemento del nombre en el Sidebar (asegúrate que el h4 tenga id="gym-name-side")
        const nombreSidebar = document.getElementById('gym-name-side');
        
        if(nombreSidebar) {
            nombreSidebar.innerText = config.name; // Aquí se pondrá "Jean La Roca" automáticamente
        }
    });
</script>
</body>
</html>
