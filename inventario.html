<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda y POS - Gym Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #f97316; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; }
        .sidebar { width: 260px; height: 100vh; background: var(--card-dark); position: fixed; border-right: 1px solid #334155; }
        .nav-link { color: #94a3b8; padding: 12px 25px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { background: #334155; color: var(--accent); border-left: 4px solid var(--accent); }
        .main-content { margin-left: 260px; padding: 25px; }
        .product-card { background: var(--card-dark); border: 1px solid #334155; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .product-card:hover { border-color: var(--accent); transform: scale(1.02); }
        .cart-panel { background: #1e293b; border-radius: 15px; padding: 20px; border: 2px solid #f97316; position: sticky; top: 20px; }
    </style>
</head>
<body>

    <div class="sidebar flex-column">
        <div class="p-4 text-center border-bottom border-secondary"><h4 id="gym-name-side" style="color: var(--accent); font-weight: bold;">GYM MASTER</h4></div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link" href="panel.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a class="nav-link" href="miembros.html"><i class="bi bi-people me-2"></i> Miembros</a>
            <a class="nav-link" href="pagos.html"><i class="bi bi-cash-stack me-2"></i> Caja y Pagos</a>
            <a class="nav-link" href="asistencia.html"><i class="bi bi-calendar-check me-2"></i> Asistencia</a>
            <a class="nav-link active" href="inventario.html"><i class="bi bi-box-seam me-2"></i> Inventario / POS</a>
            <a class="nav-link text-danger mt-5" href="index.html"><i class="bi bi-box-arrow-left me-2"></i> Salir</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="row">
            <div class="col-md-8">
                <div class="d-flex justify-content-between mb-4">
                    <h3>Punto de Venta (Tienda)</h3>
                    <button class="btn btn-warning fw-bold" data-bs-toggle="modal" data-bs-target="#modalProducto">+ NUEVO PRODUCTO</button>
                </div>
                <div class="row g-3" id="contenedor-productos">
                    <!-- Productos Cloud -->
                </div>
            </div>

            <!-- CALCULADORA / CARRITO -->
            <div class="col-md-4">
                <div class="cart-panel shadow-lg">
                    <h5 class="text-warning mb-3"><i class="bi bi-cart-fill"></i> Calculadora de Venta</h5>
                    <div id="lista-carrito" style="min-height: 150px;" class="mb-3">
                        <p class="text-center text-secondary py-4">Click en un producto para sumar</p>
                    </div>
                    <div class="border-top border-secondary pt-3">
                        <div class="d-flex justify-content-between fs-4 fw-bold text-success mb-3">
                            <span>TOTAL:</span>
                            <span id="total-venta">$0.00</span>
                        </div>
                        <button class="btn btn-success w-100 py-3 fw-bold" onclick="finalizarVentaCloud()">
                            FINALIZAR Y COBRAR
                        </button>
                        <button class="btn btn-sm btn-outline-secondary w-100 mt-2" onclick="vaciarCarrito()">Vaciar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CON MARGEN DE GANANCIA -->
    <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark border-secondary">
                <div class="modal-header border-secondary text-warning"><h5>Nuevo Producto al Almacén</h5></div>
                <div class="modal-body">
                    <form id="formProducto">
                        <div class="mb-3"><label>Nombre</label><input type="text" id="pNombre" class="form-control bg-dark text-white border-secondary" required></div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Costo de Compra ($)</label>
                                <input type="number" id="pCosto" class="form-control bg-dark text-white border-secondary" step="0.01" oninput="calcularMargen()" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Precio de Venta ($)</label>
                                <input type="number" id="pPrecio" class="form-control bg-dark text-white border-secondary" step="0.01" oninput="calcularMargen()" required>
                            </div>
                        </div>
                        <div class="p-2 mb-3 rounded bg-secondary bg-opacity-25 text-center">
                            <span class="small">Ganancia por unidad: </span>
                            <span id="label-ganancia" class="fw-bold text-success">$0.00</span>
                        </div>
                        <div class="mb-3"><label>Stock Inicial</label><input type="number" id="pStock" class="form-control bg-dark text-white border-secondary" required></div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold">GUARDAR EN LA NUBE</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let carrito = [];
        let total = 0;

        // 1. CARGAR PRODUCTOS
        onSnapshot(collection(db, "productos"), (snapshot) => {
            const contenedor = document.getElementById('contenedor-productos');
            contenedor.innerHTML = "";
            snapshot.forEach((p) => {
                const data = p.data();
                contenedor.innerHTML += `
                    <div class="col-md-4">
                        <div class="product-card p-3 text-center" onclick="agregarAlCarrito('${p.id}', '${data.nombre}', ${data.precio}, ${data.stock})">
                            <div class="fs-2">📦</div>
                            <h6 class="mb-1">${data.nombre}</h6>
                            <p class="text-success fw-bold mb-0">$${data.precio.toFixed(2)}</p>
                            <small class="text-secondary">Stock: ${data.stock}</small>
                            <button class="btn btn-xs text-danger border-0 d-block w-100 mt-2" style="font-size:0.7rem" onclick="event.stopPropagation(); eliminarProd('${p.id}')">Eliminar</button>
                        </div>
                    </div>`;
            });
        });

        // 2. LÓGICA DE VENTA
        window.agregarAlCarrito = function(id, nombre, precio, stockActual) {
            if(stockActual <= 0) return alert("¡Producto Agotado!");
            carrito.push({ id, nombre, precio });
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const lista = document.getElementById('lista-carrito');
            lista.innerHTML = "";
            total = 0;
            carrito.forEach(item => {
                total += item.precio;
                lista.innerHTML += `<div class="d-flex justify-content-between border-bottom border-secondary py-2 small">
                    <span>${item.nombre}</span><span>$${item.precio.toFixed(2)}</span>
                </div>`;
            });
            document.getElementById('total-venta').innerText = `$${total.toFixed(2)}`;
        }

        window.finalizarVentaCloud = async function() {
            if(carrito.length === 0) return;
            try {
                // Registrar en CAJA (Pagos)
                await addDoc(collection(db, "pagos"), {
                    cliente: "Cliente Tienda",
                    concepto: "Venta: " + carrito.map(c => c.nombre).join(", "),
                    monto: total,
                    hora: new Date().toLocaleTimeString(),
                    fechaCompleta: new Date().toISOString()
                });

                alert("Venta procesada. El dinero se envió a la Caja.");
                vaciarCarrito();
            } catch (e) { alert(e.message); }
        }

        window.vaciarCarrito = function() { carrito = []; actualizarCarritoUI(); }

        // 3. MARGEN DE GANANCIA
        window.calcularMargen = function() {
            const costo = document.getElementById('pCosto').value || 0;
            const venta = document.getElementById('pPrecio').value || 0;
            const ganancia = venta - costo;
            const label = document.getElementById('label-ganancia');
            label.innerText = `$${ganancia.toFixed(2)}`;
            label.className = ganancia > 0 ? "fw-bold text-success" : "fw-bold text-danger";
        }

        // 4. GUARDAR PRODUCTO
        document.getElementById('formProducto').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "productos"), {
                nombre: document.getElementById('pNombre').value,
                costo: parseFloat(document.getElementById('pCosto').value),
                precio: parseFloat(document.getElementById('pPrecio').value),
                stock: parseInt(document.getElementById('pStock').value)
            });
            bootstrap.Modal.getInstance(document.getElementById('modalProducto')).hide();
            e.target.reset();
        });

        window.eliminarProd = async (id) => { if(confirm("¿Borrar?")) await deleteDoc(doc(db, "productos", id)); }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
