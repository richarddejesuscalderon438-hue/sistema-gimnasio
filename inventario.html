<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda POS - Gym Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #f97316; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; margin: 0; }
        .sidebar { width: 260px; height: 100vh; background: var(--card-dark); position: fixed; border-right: 1px solid #334155; z-index: 100; }
        .nav-link { color: #94a3b8; padding: 15px 25px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { background: #334155; color: var(--accent); border-left: 4px solid var(--accent); }
        .main-content { margin-left: 260px; padding: 30px; }
        .product-card { background: var(--card-dark); border: 1px solid #334155; border-radius: 12px; cursor: pointer; transition: 0.2s; position: relative; }
        .product-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .cart-panel { background: #1e293b; border-radius: 15px; padding: 20px; border: 2px solid #f97316; position: sticky; top: 20px; }
        .badge-stock { position: absolute; top: 10px; right: 10px; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div class="sidebar flex-column shadow">
        <div class="p-4 text-center border-bottom border-secondary"><h4 id="gym-name-side" style="color: var(--accent); font-weight: bold;">GYM MASTER</h4></div>
      <!-- Busca estas líneas en tu código -->
<nav class="nav flex-column mt-3">
    <a class="nav-link" href="panel.html">Dashboard</a>
    <a class="nav-link" href="miembros.html">Miembros</a>
    <a class="nav-link" href="pagos.html">Caja y Pagos</a>
    <a class="nav-link" href="asistencia.html">Asistencia</a>
    <a class="nav-link" href="inventario.html">Inventario</a>
    
    <!-- AQUÍ ESTÁ EL CAMBIO: Agrégale id="btn-informes" -->
    <a class="nav-link" id="btn-informes" href="informes.html">Informes</a>
    
    <!-- AQUÍ ESTÁ EL CAMBIO: Agrégale id="btn-config" -->
    <a class="nav-link" id="btn-config" href="usuarios.html">Configuración</a>
    
    <a class="nav-link text-danger mt-5" href="index.html">Salir</a>
</nav>
    </div>

    <div class="main-content">
        <div class="row">
            <div class="col-md-8">
                <div class="d-flex justify-content-between mb-4">
                    <h3>Venta de Productos</h3>
                    <button class="btn btn-warning fw-bold" data-bs-toggle="modal" data-bs-target="#modalProducto">+ NUEVO PRODUCTO</button>
                </div>
                <div class="row g-3" id="contenedor-productos">
                    <!-- Productos se cargan aquí -->
                </div>
            </div>

            <!-- CARRITO / CALCULADORA -->
            <div class="col-md-4">
                <div class="cart-panel shadow-lg">
                    <h5 class="text-warning mb-3"><i class="bi bi-cart-fill"></i> Detalle de Venta</h5>
                    <div id="lista-carrito" style="min-height: 120px;" class="mb-3">
                        <p class="text-center text-secondary py-4 small">Seleccione productos del catálogo</p>
                    </div>
                    <div class="border-top border-secondary pt-3">
                        <div class="d-flex justify-content-between fs-4 fw-bold text-success mb-3">
                            <span>TOTAL:</span>
                            <span id="total-venta">$0.00</span>
                        </div>
                        <button class="btn btn-success w-100 py-3 fw-bold" onclick="finalizarVentaCloud()">
                            FINALIZAR Y DESCONTAR
                        </button>
                        <button class="btn btn-sm btn-outline-secondary w-100 mt-2" onclick="vaciarCarrito()">Limpiar Carrito</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVO PRODUCTO -->
    <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content bg-dark border-secondary"><div class="modal-body">
            <h5 class="text-warning mb-3">Nuevo Producto</h5>
            <form id="formProducto">
                <div class="mb-3"><label class="small">Nombre</label><input type="text" id="pNombre" class="form-control" required></div>
                <div class="row">
                    <div class="col-6 mb-3"><label class="small">Costo Compra</label><input type="number" id="pCosto" class="form-control" step="0.01" oninput="calcularMargen()"></div>
                    <div class="col-6 mb-3"><label class="small">Precio Venta</label><input type="number" id="pPrecio" class="form-control" step="0.01" oninput="calcularMargen()"></div>
                </div>
                <div class="p-2 mb-3 rounded bg-secondary bg-opacity-10 text-center small">Ganancia: <span id="label-ganancia" class="fw-bold">$0.00</span></div>
                <div class="mb-3"><label class="small">Stock Inicial</label><input type="number" id="pStock" class="form-control" required></div>
                <button type="submit" class="btn btn-warning w-100 fw-bold">REGISTRAR EN NUBE</button>
            </form>
        </div></div></div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let carrito = [];
        let total = 0;

        // 1. SINCRONIZAR NOMBRE
        onSnapshot(doc(db, "configuracion", "general"), (ds) => { if(ds.exists()) document.getElementById('gym-name-side').innerText = ds.data().nombre; });

        // 2. CARGAR PRODUCTOS Y MOSTRAR STOCK REAL
        onSnapshot(collection(db, "productos"), (snapshot) => {
            const contenedor = document.getElementById('contenedor-productos');
            contenedor.innerHTML = "";
            snapshot.forEach((p) => {
                const data = p.data();
                const agotado = data.stock <= 0;
                contenedor.innerHTML += `
                    <div class="col-md-4">
                        <div class="product-card p-3 text-center ${agotado ? 'opacity-50' : ''}" onclick="${agotado ? '' : `agregarAlCarrito('${p.id}', '${data.nombre}', ${data.precio})`}">
                            <span class="badge badge-stock ${agotado ? 'bg-danger' : 'bg-success'}">${data.stock} disp.</span>
                            <div class="fs-2">📦</div>
                            <h6 class="mt-2 mb-1">${data.nombre}</h6>
                            <p class="text-success fw-bold mb-0">$${data.precio.toFixed(2)}</p>
                            <button class="btn btn-xs text-danger border-0 w-100 mt-2" style="font-size:0.6rem" onclick="event.stopPropagation(); borrarP('${p.id}')">ELIMINAR</button>
                        </div>
                    </div>`;
            });
        });

        // 3. CARRITO
        window.agregarAlCarrito = function(id, nombre, precio) {
            carrito.push({ id, nombre, precio });
            renderCarrito();
        }

        function renderCarrito() {
            const lista = document.getElementById('lista-carrito');
            lista.innerHTML = ""; total = 0;
            carrito.forEach(item => {
                total += item.precio;
                lista.innerHTML += `<div class="d-flex justify-content-between border-bottom border-secondary py-1 small"><span>${item.nombre}</span><span>$${item.precio.toFixed(2)}</span></div>`;
            });
            document.getElementById('total-venta').innerText = `$${total.toFixed(2)}`;
        }

        window.vaciarCarrito = function() { carrito = []; renderCarrito(); }

        // 4. FINALIZAR VENTA (AQUÍ ESTÁ LA MAGIA DEL DESCUENTO)
        window.finalizarVentaCloud = async function() {
            if(carrito.length === 0) return;
            try {
                // A) Enviar dinero a la Caja (Pagos)
                await addDoc(collection(db, "pagos"), {
                    cliente: "Venta Tienda",
                    concepto: "POS: " + carrito.map(c => c.nombre).join(", "),
                    monto: total,
                    hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    fechaCompleta: new Date().toISOString()
                });

                // B) DESCONTAR STOCK REAL EN FIREBASE
                for (const item of carrito) {
                    const productoRef = doc(db, "productos", item.id);
                    await updateDoc(productoRef, {
                        stock: increment(-1) // RESTA 1 UNIDAD AUTOMÁTICAMENTE EN LA NUBE
                    });
                }

                alert("✅ Venta Exitosa. Stock actualizado y dinero enviado a caja.");
                vaciarCarrito();
            } catch (e) { alert("Error: " + e.message); }
        }

        // 5. UTILIDADES
        window.calcularMargen = function() {
            const c = document.getElementById('pCosto').value || 0;
            const v = document.getElementById('pPrecio').value || 0;
            const res = document.getElementById('label-ganancia');
            res.innerText = `$${(v - c).toFixed(2)}`;
            res.className = (v-c) >= 0 ? "fw-bold text-success" : "fw-bold text-danger";
        }

        document.getElementById('formProducto').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "productos"), {
                nombre: document.getElementById('pNombre').value,
                costo: parseFloat(document.getElementById('pCosto').value),
                precio: parseFloat(document.getElementById('pPrecio').value),
                stock: parseInt(document.getElementById('pStock').value)
            });
            bootstrap.Modal.getInstance(document.getElementById('modalProducto')).hide();
            e.target.reset();
        };

        window.borrarP = async (id) => { if(confirm("¿Borrar?")) await deleteDoc(doc(db, "productos", id)); }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- COPIA DESDE AQUÍ -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Leemos qué usuario entró (master, propietario o admin)
            const rol = localStorage.getItem('rol');

            // 2. Localizamos los botones en el menú
            const btnConfig = document.getElementById('btn-config');
            const btnInformes = document.getElementById('btn-informes');

            // 3. REGLAS DE PODER
            if (rol === 'master') {
                // TÚ: Ves todo. Forzamos a que se muestren.
                if (btnConfig) btnConfig.style.display = 'block';
                if (btnInformes) btnInformes.style.display = 'block';
            } 
            else if (rol === 'propietario') {
                // DUEÑO GYM: Ve informes, pero ocultamos configuración
                if (btnConfig) btnConfig.style.display = 'none';
                if (btnInformes) btnInformes.style.display = 'block';
            } 
            else {
                // RECEPCIONISTA (admin): Ocultamos los dos botones delicados
                if (btnConfig) btnConfig.style.display = 'none';
                if (btnInformes) btnInformes.style.display = 'none';
            }
        });
    </script>
    <!-- HASTA AQUÍ -->


</body>
</html>
