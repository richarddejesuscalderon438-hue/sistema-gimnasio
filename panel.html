<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pro - Gym Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #f97316; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; margin: 0; }
        .sidebar { width: 260px; height: 100vh; background: var(--card-dark); position: fixed; border-right: 1px solid #334155; z-index: 100; }
        .nav-link { color: #94a3b8; padding: 15px 25px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { background: #334155; color: var(--accent); border-left: 4px solid var(--accent); }
        .main-content { margin-left: 260px; padding: 40px; }
        .card-stats { background: var(--card-dark); border-radius: 15px; padding: 25px; border: 1px solid #334155; text-align: center; }
        .card-chart { background: var(--card-dark); border-radius: 20px; padding: 20px; border: 1px solid #334155; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="sidebar flex-column shadow">
        <div class="p-4 text-center border-bottom border-secondary"><h4 id="gym-name-side" style="color: var(--accent); font-weight: bold;">GYM MASTER</h4></div>
      <!-- Busca estas líneas en tu código -->
<nav class="nav flex-column mt-3">
    <a class="nav-link" href="panel.html">Dashboard</a>
    <a class="nav-link" href="miembros.html">Miembros</a>
    <a class="nav-link" href="pagos.html">Caja y Pagos</a>
    <a class="nav-link" href="asistencia.html">Asistencia</a>
    <a class="nav-link" href="inventario.html">Inventario</a>
    
    <!-- AQUÍ ESTÁ EL CAMBIO: Agrégale id="btn-informes" -->
    <a class="nav-link" id="btn-informes" href="informes.html">Informes</a>
    
    <!-- AQUÍ ESTÁ EL CAMBIO: Agrégale id="btn-config" -->
    <a class="nav-link" id="btn-config" href="usuarios.html">Configuración</a>
    
    <a class="nav-link text-danger mt-5" href="index.html">Salir</a>
</nav>
    </div>

    <div class="main-content">
        <h3>Panel de Control</h3>
        <!-- TARJETAS SUPERIORES -->
        <div class="row g-4 mt-2">
            <div class="col-md-3"><div class="card-stats shadow"><h6>SOCIOS TOTALES</h6><h2 id="total-socios">0</h2></div></div>
            <div class="col-md-3"><div class="card-stats border-success shadow"><h6>CAJA ACTUAL</h6><h2 id="total-dinero" class="text-success">$0.00</h2></div></div>
            <div class="col-md-3"><div class="card-stats border-info shadow"><h6>ACCESOS HOY</h6><h2 id="total-asistencias" class="text-info">0</h2></div></div>
            <div class="col-md-3"><div class="card-stats shadow"><h6>PRODUCTOS</h6><h2 id="total-productos">0</h2></div></div>
        </div>

        <!-- GRÁFICAS RESTAURADAS -->
        <div class="row mt-4">
            <div class="col-md-8">
                <div class="card-chart">
                    <h5 class="mb-4 text-warning">Flujo de Ingresos Recientes</h5>
                    <canvas id="graficaIngresos" height="120"></canvas>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-chart">
                    <h5 class="mb-4 text-warning">Planes</h5>
                    <canvas id="graficaPlanes"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. Sincronizar Nombre
        onSnapshot(doc(db, "configuracion", "general"), (ds) => { if(ds.exists()) document.getElementById('gym-name-side').innerText = ds.data().nombre; });
        
        // 2. Gráficas (Variables para control)
        let chartIngresos, chartPlanes;

        // 3. Datos en Tiempo Real
        onSnapshot(collection(db, "socios"), (s) => {
            document.getElementById('total-socios').innerText = s.size;
            let mensual = 0, anual = 0;
            s.forEach(d => { if(d.data().plan === "Mensual") mensual++; else anual++; });
            actualizarPlanes(mensual, anual);
        });

        onSnapshot(collection(db, "productos"), (s) => { document.getElementById('total-productos').innerText = s.size; });

        onSnapshot(collection(db, "pagos"), (s) => {
            let total = 0; let montos = []; let horas = [];
            s.forEach(d => { total += d.data().monto; montos.push(d.data().monto); horas.push(d.data().hora); });
            document.getElementById('total-dinero').innerText = "$" + total.toFixed(2);
            actualizarIngresos(montos.slice(-7), horas.slice(-7));
        });

        onSnapshot(collection(db, "asistencia"), (s) => {
            const hoy = new Date().toLocaleDateString();
            let cont = 0;
            s.forEach(d => { if(d.data().fechaSimple === hoy) cont++; });
            document.getElementById('total-asistencias').innerText = cont;
        });

        function actualizarIngresos(datos, etiquetas) {
            const ctx = document.getElementById('graficaIngresos');
            if(chartIngresos) chartIngresos.destroy();
            chartIngresos = new Chart(ctx, { type: 'line', data: { labels: etiquetas, datasets: [{ label: 'Ventas', data: datos, borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.1)', fill: true, tension: 0.4 }] }, options: { plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#334155' } }, x: { grid: { display: false } } } } });
        }

        function actualizarPlanes(m, a) {
            const ctx = document.getElementById('graficaPlanes');
            if(chartPlanes) chartPlanes.destroy();
            chartPlanes = new Chart(ctx, { type: 'doughnut', data: { labels: ['Mensual', 'Anual'], datasets: [{ data: [m, a], backgroundColor: ['#f97316', '#3b82f6'], borderWidth: 0 }] }, options: { plugins: { legend: { labels: { color: 'white' } } } } });
        }
    </script>
    <!-- COPIA DESDE AQUÍ -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Leemos qué usuario entró (master, propietario o admin)
            const rol = localStorage.getItem('rol');

            // 2. Localizamos los botones en el menú
            const btnConfig = document.getElementById('btn-config');
            const btnInformes = document.getElementById('btn-informes');

            // 3. REGLAS DE PODER
            if (rol === 'master') {
                // TÚ: Ves todo. Forzamos a que se muestren.
                if (btnConfig) btnConfig.style.display = 'block';
                if (btnInformes) btnInformes.style.display = 'block';
            } 
            else if (rol === 'propietario') {
                // DUEÑO GYM: Ve informes, pero ocultamos configuración
                if (btnConfig) btnConfig.style.display = 'none';
                if (btnInformes) btnInformes.style.display = 'block';
            } 
            else {
                // RECEPCIONISTA (admin): Ocultamos los dos botones delicados
                if (btnConfig) btnConfig.style.display = 'none';
                if (btnInformes) btnInformes.style.display = 'none';
            }
        });
    </script>
    <!-- HASTA AQUÍ -->

</body> <!-- Esta es la última línea de tu archivo -->
</body>
</html>
