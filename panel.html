<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Real - Gym Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #f97316; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; }
        .sidebar { width: 260px; height: 100vh; background: var(--card-dark); position: fixed; border-right: 1px solid #334155; z-index: 100; }
        .nav-link { color: #94a3b8; padding: 15px 25px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { background: #334155; color: var(--accent); border-left: 4px solid var(--accent); }
        .main-content { margin-left: 260px; padding: 40px; }
        .card-stats { background: var(--card-dark); border-radius: 15px; padding: 25px; border: 1px solid #334155; text-align: center; }
        .card-chart { background: var(--card-dark); border-radius: 20px; padding: 25px; border: 1px solid #334155; height: 100%; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar flex-column">
        <div class="p-4 text-center border-bottom border-secondary"><h4 style="color: var(--accent); font-weight: bold;">🏋️‍♂️ GYM MASTER</h4></div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link active" href="panel.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a class="nav-link" href="miembros.html"><i class="bi bi-people me-2"></i> Miembros</a>
            <a class="nav-link" href="pagos.html"><i class="bi bi-cash-stack me-2"></i> Caja y Pagos</a>
            <a class="nav-link" href="asistencia.html"><i class="bi bi-calendar-check me-2"></i> Asistencia</a>
            <a class="nav-link" href="inventario.html"><i class="bi bi-box-seam me-2"></i> Inventario</a>
            <a class="nav-link" id="btn-config" href="usuarios.html"><i class="bi bi-gear me-2"></i> Configuración</a>
            <a class="nav-link text-danger mt-5" href="index.html"><i class="bi bi-box-arrow-left me-2"></i> Salir</a>
        </nav>
    </div>

    <!-- CONTENIDO -->
    <div class="main-content">
        <div class="d-flex justify-content-between mb-4">
            <h2 id="saludo-usuario">Cargando Panel...</h2>
            <div class="badge bg-success p-2"><i class="bi bi-shield-check me-1"></i> SISTEMA ACTIVO</div>
        </div>

        <!-- TARJETAS CON DATOS REALES -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card-stats shadow">
                    <small class="text-secondary">TOTAL SOCIOS</small>
                    <h2 class="fw-bold mb-0" id="total-socios">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-stats shadow border-success" style="border-width: 2px;">
                    <small class="text-success fw-bold">RECAUDACIÓN TOTAL</small>
                    <h2 class="fw-bold mb-0 text-success" id="total-dinero">$0.00</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-stats shadow border-info">
                    <small class="text-info">ACCESOS HOY</small>
                    <h2 class="fw-bold mb-0 text-info" id="total-asistencias">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-stats shadow">
                    <small class="text-secondary">PRODUCTOS EN TIENDA</small>
                    <h2 class="fw-bold mb-0" id="total-productos">0</h2>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- GRÁFICA DE VENTAS -->
            <div class="col-md-8">
                <div class="card-chart shadow">
                    <h5 class="mb-4 text-warning">Historial de Flujo de Caja</h5>
                    <canvas id="graficaVentas" height="150"></canvas>
                </div>
            </div>
            <!-- GRÁFICA DE MEMBRESÍAS -->
            <div class="col-md-4">
                <div class="card-chart shadow text-center">
                    <h5 class="mb-4 text-warning">Distribución de Planes</h5>
                    <canvas id="graficaPlanes"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module">
    import { db } from './firebase-config.js';
    import { collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    document.addEventListener("DOMContentLoaded", function() {
        // 1. SEGURIDAD Y SALUDO
        const rol = localStorage.getItem('rol');
        const user = localStorage.getItem('rol') === 'master' ? 'MAESTRO' : 'ADMINISTRADOR';
        document.getElementById('saludo-usuario').innerText = "Bienvenido, " + user;
        if(rol === 'admin') document.getElementById('btn-config').style.display = 'none';

        onSnapshot(doc(db, "configuracion", "general"), (docSnap) => {
    if (docSnap.exists()) {
        const nombreReal = docSnap.data().nombre;
        const etiquetaSidebar = document.getElementById('gym-name-side');
        if(etiquetaSidebar) etiquetaSidebar.innerText = nombreReal;
    }
});

        // 3. CONECTAR MÉTRICAS A FIREBASE (TIEMPO REAL)
        
        // A) Contar Socios y dibujar Gráfica de Planes
        onSnapshot(collection(db, "socios"), (snapshot) => {
            document.getElementById('total-socios').innerText = snapshot.size; // Cuenta los documentos reales

            let mensual = 0;
            let anual = 0;
            
            snapshot.forEach((doc) => {
                const plan = doc.data().plan;
                if(plan === "Mensual") mensual++;
                if(plan === "Anual") anual++;
            });

            // Actualizar Gráfica
            actualizarGraficaPlanes(mensual, anual);
        });

        // B) Contar Dinero (Recaudación Total) y dibujar Gráfica de Ventas
        onSnapshot(collection(db, "pagos"), (snapshot) => {
            let sumaTotal = 0;
            let ultimosPagos = [];

            snapshot.forEach((doc) => {
                const monto = doc.data().monto;
                sumaTotal += monto;
                ultimosPagos.push(doc.data()); // Guardamos para la gráfica
            });

            document.getElementById('total-dinero').innerText = "$" + sumaTotal.toFixed(2);

            // Actualizar Gráfica con los últimos 5 pagos
            actualizarGraficaVentas(ultimosPagos.slice(0, 5).reverse());
        });

       // C) Contar Asistencias de hoy (Real desde Firebase)

    document.getElementById('total-asistencias').innerText = snapshot.size;
});

// D) Contar Productos (Real desde Firebase)

    document.getElementById('total-productos').innerText = snapshot.size;

    // --- FUNCIONES PARA DIBUJAR GRÁFICAS ---
    let chartPlanes = null;
    let chartVentas = null;

    function actualizarGraficaPlanes(mensual, anual) {
        const ctx = document.getElementById('graficaPlanes');
        if(chartPlanes) chartPlanes.destroy(); // Borramos la vieja antes de pintar la nueva

        chartPlanes = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Mensual', 'Anual'],
                datasets: [{
                    data: [mensual || 1, anual || 0], // El '1' evita que la gráfica se rompa si no hay socios
                    backgroundColor: ['#f97316', '#3b82f6'],
                    borderWidth: 0
                }]
            },
            options: { plugins: { legend: { labels: { color: 'white' } } } }
        });
    }

    function actualizarGraficaVentas(pagosRecientes) {
        const ctx = document.getElementById('graficaVentas');
        if(chartVentas) chartVentas.destroy();

        const etiquetas = pagosRecientes.map(p => p.hora || '00:00');
        const montos = pagosRecientes.map(p => p.monto || 0);

        chartVentas = new Chart(ctx, {
            type: 'line',
            data: {
                labels: etiquetas.length > 0 ? etiquetas : ['Inicio'],
                datasets: [{
                    label: 'Ingresos ($)',
                    data: montos.length > 0 ? montos : [0],
                    borderColor: '#22c55e',
                    backgroundColor: 'rgba(34, 197, 94, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: {
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                }
            }
        });
    }
</script>

            // 2. Si eres el Recepcionista (admin), se ocultan los Informes de dinero
            if (rol === 'admin') {
                if (btnInformes) btnInformes.style.display = 'none';
            }
        });
    </script>
