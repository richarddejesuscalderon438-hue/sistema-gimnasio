<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Gym Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #f97316; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; margin: 0; }
        .sidebar { width: 260px; height: 100vh; background: var(--card-dark); position: fixed; border-right: 1px solid #334155; z-index: 100; }
        .nav-link { color: #94a3b8; padding: 15px 25px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { background: #334155; color: var(--accent); border-left: 4px solid var(--accent); }
        .main-content { margin-left: 260px; padding: 40px; }
        .card-stats { background: var(--card-dark); border-radius: 15px; padding: 20px; border: 1px solid #334155; text-align: center; }
    </style>
</head>
<body>
    <div class="sidebar flex-column">
        <div class="p-4 text-center border-bottom border-secondary"><h4 id="gym-name-side" style="color: var(--accent); font-weight: bold;">GYM MASTER</h4></div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link active" href="panel.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a class="nav-link" href="miembros.html"><i class="bi bi-people me-2"></i> Miembros</a>
            <a class="nav-link" href="pagos.html"><i class="bi bi-cash-stack me-2"></i> Caja y Pagos</a>
            <a class="nav-link" href="asistencia.html"><i class="bi bi-calendar-check me-2"></i> Asistencia</a>
            <a class="nav-link" href="inventario.html"><i class="bi bi-box-seam me-2"></i> Inventario</a>
            <a class="nav-link" id="btn-informes" href="informes.html"><i class="bi bi-graph-up me-2"></i> Informes</a>
            <a class="nav-link text-danger mt-5" href="index.html"><i class="bi bi-box-arrow-left me-2"></i> Salir</a>
        </nav>
    </div>

    <div class="main-content">
        <h2 id="saludo-usuario">Bienvenido</h2>
        <div class="row g-4 mt-2">
            <div class="col-md-3"><div class="card-stats"><h6>SOCIOS TOTALES</h6><h2 id="total-socios">0</h2></div></div>
            <div class="col-md-3"><div class="card-stats border-success"><h6>CAJA TURNO</h6><h2 id="total-dinero" class="text-success">$0.00</h2></div></div>
            <div class="col-md-3"><div class="card-stats border-info"><h6>ACCESOS HOY</h6><h2 id="total-asistencias" class="text-info">0</h2></div></div>
            <div class="col-md-3"><div class="card-stats"><h6>PRODUCTOS</h6><h2 id="total-productos">0</h2></div></div>
        </div>
        <div class="row mt-4">
            <div class="col-md-12"><div class="card-stats" style="height: 300px;"><canvas id="graficaVentas"></canvas></div></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const hoy = new Date().toLocaleDateString();

        onSnapshot(doc(db, "configuracion", "general"), (ds) => { if(ds.exists()) document.getElementById('gym-name-side').innerText = ds.data().nombre; });

        onSnapshot(collection(db, "socios"), (s) => { document.getElementById('total-socios').innerText = s.size; });
        onSnapshot(collection(db, "productos"), (s) => { document.getElementById('total-productos').innerText = s.size; });
        onSnapshot(collection(db, "pagos"), (s) => { 
            let total = 0; s.forEach(d => total += d.data().monto);
            document.getElementById('total-dinero').innerText = "$" + total.toFixed(2);
        });

        // REINICIO VISUAL DIARIO: Solo cuenta si fechaSimple === hoy
        onSnapshot(collection(db, "asistencia"), (s) => {
            let cont = 0;
            s.forEach(d => { if(d.data().fechaSimple === hoy) cont++; });
            document.getElementById('total-asistencias').innerText = cont;
        });
    </script>
</body>
</html>
