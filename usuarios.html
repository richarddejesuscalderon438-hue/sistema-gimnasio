<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - Richard Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #f97316; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; margin: 0; }
        .sidebar { width: 260px; height: 100vh; background: var(--card-dark); position: fixed; border-right: 1px solid #334155; z-index: 100; }
        .nav-link { color: #94a3b8; padding: 15px 25px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { background: #334155; color: var(--accent); border-left: 4px solid var(--accent); }
        .main-content { margin-left: 260px; padding: 30px; }
        .config-card { background: var(--card-dark); border-radius: 15px; padding: 25px; border: 1px solid #334155; margin-bottom: 20px; }
        .form-control, .form-select { background: #0f172a; border: 1px solid #334155; color: white; }
    </style>
</head>
<body>
    <div class="sidebar flex-column shadow">
        <div class="p-4 text-center border-bottom border-secondary"><h4 id="gym-name-side" style="color: var(--accent); font-weight: bold;">CARGANDO...</h4></div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link" href="panel.html">Dashboard</a>
            <a class="nav-link" href="miembros.html">Miembros</a>
            <a class="nav-link" href="pagos.html">Caja y Pagos</a>
            <a class="nav-link" href="asistencia.html">Asistencia</a>
            <a class="nav-link" href="inventario.html">Inventario</a>
            <a class="nav-link" href="informes.html">Informes</a>
            <a class="nav-link active" href="usuarios.html">Configuración</a>
            <a class="nav-link text-danger mt-5" href="index.html">Salir</a>
        </nav>
    </div>

    <div class="main-content" id="contenido-protegido" style="display: none;">
        <h2 class="mb-4">Panel de Control Maestro</h2>
        <div class="row">
            <div class="col-md-6">
                <div class="config-card">
                    <h5>Nombre del Gimnasio</h5>
                    <input type="text" id="set-gym-name" class="form-control mb-3">
                    <button class="btn btn-warning w-100 fw-bold" onclick="guardarNombreCloud()">GUARDAR CAMBIOS</button>
                </div>
            </div>
            <div class="col-md-6">
                <div class="config-card">
                    <div class="d-flex justify-content-between mb-3">
                        <h5>Usuarios</h5>
                        <button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#modalUser">+ Nuevo</button>
                    </div>
                    <table class="table table-dark table-sm">
                        <thead><tr><th>User</th><th>Rol</th><th></th></tr></thead>
                        <tbody id="tabla-usuarios"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL USUARIO -->
    <div class="modal fade" id="modalUser" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content bg-dark border-secondary p-3"><form id="formNuevoUser">
            <h5>Crear Usuario</h5>
            <input type="text" id="new-user-name" class="form-control mb-2" placeholder="Usuario" required>
            <input type="password" id="new-user-pass" class="form-control mb-2" placeholder="Clave" required>
            <select id="new-user-rol" class="form-select mb-3">
                <option value="propietario">Propietario (Dueño Gym)</option>
                <option value="admin">Administración (Empleado)</option>
            </select>
            <button class="btn btn-warning w-100 fw-bold">CREAR CUENTA</button>
        </form></div></div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, addDoc, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // VERIFICACIÓN DE SEGURIDAD ANTES DE MOSTRAR NADA
        const rol = localStorage.getItem('rol');
        if(rol !== 'master') {
            alert("⛔ Solo el MASTER tiene acceso a esta página.");
            window.location.href = "panel.html";
        } else {
            document.getElementById('contenido-protegido').style.display = 'block';
        }

        // SINCRONIZAR NOMBRE
        onSnapshot(doc(db, "configuracion", "general"), (ds) => {
            if(ds.exists()) {
                document.getElementById('gym-name-side').innerText = ds.data().nombre;
                document.getElementById('set-gym-name').value = ds.data().nombre;
            }
        });

        window.guardarNombreCloud = async function() {
            await setDoc(doc(db, "configuracion", "general"), { nombre: document.getElementById('set-gym-name').value });
            alert("¡Nombre actualizado!");
        };

        // LISTAR Y CREAR USUARIOS
        onSnapshot(collection(db, "system_users"), (snap) => {
            const tabla = document.getElementById('tabla-usuarios');
            tabla.innerHTML = "";
            snap.forEach(u => {
                const d = u.data();
                tabla.innerHTML += `<tr><td>${d.user}</td><td>${d.rol}</td><td><button class="btn btn-sm text-danger" onclick="borrarU('${u.id}')">X</button></td></tr>`;
            });
        });

        document.getElementById('formNuevoUser').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "system_users"), {
                user: document.getElementById('new-user-name').value.toLowerCase(),
                pass: document.getElementById('new-user-pass').value,
                rol: document.getElementById('new-user-rol').value
            });
            bootstrap.Modal.getInstance(document.getElementById('modalUser')).hide();
            e.target.reset();
        };

        window.borrarU = async (id) => { if(confirm("¿Borrar?")) await deleteDoc(doc(db, "system_users", id)); };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
