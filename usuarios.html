<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración Profesional - Gym Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #f97316; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; overflow-x: hidden; }
        
        /* SIDEBAR RESPONSIVE */
        .sidebar { width: 260px; height: 100vh; background: var(--card-dark); position: fixed; transition: 0.3s; z-index: 1000; }
        .main-content { margin-left: 260px; padding: 20px; transition: 0.3s; }
        
        @media (max-width: 768px) {
            .sidebar { margin-left: -260px; }
            .sidebar.active { margin-left: 0; }
            .main-content { margin-left: 0; }
        }

        .nav-link { color: #94a3b8; padding: 12px 20px; display: block; text-decoration: none; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: #334155; color: var(--accent); border-left: 4px solid var(--accent); }
        .config-card { background: var(--card-dark); border-radius: 15px; padding: 20px; border: 1px solid #334155; margin-bottom: 20px; }
        .form-control { background: #0f172a; border: 1px solid #334155; color: white; }
    </style>
</head>
<body>

    <!-- BOTÓN MÓVIL -->
    <button class="btn btn-warning d-md-none position-fixed top-0 start-0 m-2 z-3" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </button>

    <div class="sidebar flex-column" id="sidebar">
        <div class="p-4 text-center border-bottom border-secondary">
            <img id="logo-preview" src="" style="max-width: 50px; display: none;" class="mb-2">
            <h4 id="gym-name-side" style="color: var(--accent); font-weight: bold;">GYM MASTER</h4>
        </div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link" href="panel.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a class="nav-link" href="miembros.html"><i class="bi bi-people me-2"></i> Miembros</a>
            <a class="nav-link" href="pagos.html"><i class="bi bi-cash-stack me-2"></i> Caja y Pagos</a>
            <a class="nav-link" href="asistencia.html"><i class="bi bi-calendar-check me-2"></i> Asistencia</a>
            <a class="nav-link" href="inventario.html"><i class="bi bi-box-seam me-2"></i> Inventario</a>
            <a class="nav-link active" href="usuarios.html"><i class="bi bi-gear me-2"></i> Configuración</a>
            <a class="nav-link text-danger mt-5" href="index.html"><i class="bi bi-box-arrow-left me-2"></i> Salir</a>
        </nav>
    </div>

    <div class="main-content">
        <h2 class="mb-4">Configuración del Sistema</h2>

        <!-- PANEL MASTER: Solo para ti -->
        <div id="panel-master" class="config-card border-warning shadow" style="display: none;">
            <h5 class="text-warning"><i class="bi bi-crown-fill me-2"></i> PANEL MASTER (SUPER USUARIO)</h5>
            <hr class="border-secondary">
            <div class="row g-2">
                <div class="col-md-4"><button class="btn btn-outline-danger w-100">SUSPENDER GYM</button></div>
                <div class="col-md-4"><button class="btn btn-outline-info w-100">EDITAR LICENCIA</button></div>
                <div class="col-md-4"><button class="btn btn-outline-light w-100" onclick="localStorage.clear(); location.reload();">RESETEAR TODO</button></div>
            </div>
        </div>

        <div class="row">
            <!-- AJUSTES DEL GIMNASIO (Para Master y Propietario) -->
            <div class="col-md-6">
                <div class="config-card">
                    <h5 class="text-orange" style="color: var(--accent);">Personalización del Gym</h5>
                    <div class="mb-3">
                        <label class="small text-secondary">NOMBRE DEL CLIENTE (GYM)</label>
                        <input type="text" id="set-gym-name" class="form-control" placeholder="Ej: Power Fitness">
                    </div>
                    <div class="mb-3">
                        <label class="small text-secondary">URL DEL LOGO (IMAGEN)</label>
                        <input type="text" id="set-gym-logo" class="form-control" placeholder="https://link-de-tu-logo.png">
                    </div>
                    <button class="btn btn-warning w-100 fw-bold" onclick="guardarConfig()">GUARDAR CAMBIOS</button>
                </div>
            </div>

            <!-- GESTIÓN DE USUARIOS -->
            <div class="col-md-6">
                <div class="config-card">
                    <div class="d-flex justify-content-between mb-4">
                        <h5>Cuentas de Acceso</h5>
                        <button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#modalUser">Nuevo Usuario</button>
                    </div>
                    <table class="table table-dark table-sm">
                        <thead><tr class="text-secondary small"><th>Usuario</th><th>Rol</th><th>Eliminar</th></tr></thead>
                        <tbody id="tabla-usuarios"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVO USUARIO -->
    <div class="modal fade" id="modalUser" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content bg-dark border-secondary p-3"><form id="formNuevoUser">
            <h5 class="text-warning">Crear Nuevo Usuario</h5>
            <div class="mb-2"><label class="small">Nombre</label><input type="text" id="new-user-name" class="form-control" required></div>
            <div class="mb-2"><label class="small">Contraseña</label><input type="password" id="new-user-pass" class="form-control" required></div>
            <div class="mb-3"><label class="small">Rol</label>
                <select id="new-user-rol" class="form-select bg-secondary text-white">
                    <option value="admin">Administración (No ve Config)</option>
                    <option value="propietario">Propietario (Acceso total)</option>
                </select>
            </div>
            <button class="btn btn-warning w-100 fw-bold">CREAR CUENTA</button>
        </form></div></div>
    </div>

    <script type="module">
    import { db } from './firebase-config.js';
    import { doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. ESCUCHAR EL NOMBRE DEL GYM DESDE LA NUBE
    onSnapshot(doc(db, "configuracion", "general"), (docSnap) => {
        if (docSnap.exists()) {
            const data = docSnap.data();
            document.getElementById('set-gym-name').value = data.nombre;
            document.getElementById('gym-name-side').innerText = data.nombre;
            // Guardamos una copia local para las otras páginas (opcional)
            localStorage.setItem('gym_name', data.nombre);
        }
    });

    // 2. GUARDAR EL NOMBRE EN LA NUBE
    window.guardarConfig = async function() {
        const nuevoNombre = document.getElementById('set-gym-name').value;
        try {
            await setDoc(doc(db, "configuracion", "general"), {
                nombre: nuevoNombre
            });
            alert("¡Nombre actualizado en la nube para todos los dispositivos!");
        } catch (e) {
            alert("Error: " + e.message);
        }
    };

    // (Mantén aquí abajo tu código de Crear Usuarios que ya tenías)
</script>
</body>
</html>
