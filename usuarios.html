<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración Maestra - Gym Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #f97316; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; margin: 0; }
        .sidebar { width: 260px; height: 100vh; background: var(--card-dark); position: fixed; border-right: 1px solid #334155; z-index: 100; }
        .nav-link { color: #94a3b8; padding: 15px 25px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { background: #334155; color: var(--accent); border-left: 4px solid var(--accent); }
        .main-content { margin-left: 260px; padding: 30px; }
        .config-card { background: var(--card-dark); border-radius: 15px; padding: 25px; border: 1px solid #334155; margin-bottom: 25px; }
        .form-control, .form-select { background: #0f172a; border: 1px solid #334155; color: white; }
        .panel-master { border: 2px solid #ffc107 !important; background: rgba(255, 193, 7, 0.05); }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar flex-column shadow">
        <div class="p-4 text-center border-bottom border-secondary">
            <h4 id="gym-name-side" style="color: var(--accent); font-weight: bold;">GYM MASTER</h4>
        </div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link" href="panel.html">Dashboard</a>
            <a class="nav-link" href="miembros.html">Miembros</a>
            <a class="nav-link" href="pagos.html">Caja y Pagos</a>
            <a class="nav-link" href="asistencia.html">Asistencia</a>
            <a class="nav-link" href="inventario.html">Inventario</a>
            <a class="nav-link" href="informes.html">Informes</a>
            <a class="nav-link active" id="btn-config" href="usuarios.html">Configuración</a>
            <a class="nav-link text-danger mt-5" href="index.html">Salir</a>
        </nav>
    </div>

    <div class="main-content">
        <h2 class="mb-4 text-warning">Panel de Control Jerárquico</h2>

        <!-- 1. PANEL MASTER (SOLO RICHARD) -->
        <div id="panel-richard" class="config-card panel-master shadow-lg" style="display: none;">
            <h5 style="color: #ffc107;"><i class="bi bi-shield-lock-fill me-2"></i> HERRAMIENTAS DE PROVEEDOR (SOLO TÚ)</h5>
            <p class="small text-secondary">Usa estos botones para gestionar el acceso del cliente.</p>
            <div class="row g-2">
                <div class="col-md-6">
                    <button class="btn btn-danger w-100 fw-bold" onclick="suspenderServicio()">
                        <i class="bi bi-x-octagon-fill me-2"></i> SUSPENDER POR FALTA DE PAGO
                    </button>
                </div>
                <div class="col-md-6">
                    <button class="btn btn-success w-100 fw-bold" onclick="activarServicio()">
                        <i class="bi bi-check-circle-fill me-2"></i> ACTIVAR SERVICIO NORMAL
                    </button>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- 2. AJUSTES DEL NEGOCIO -->
            <div class="col-md-6">
                <div class="config-card">
                    <h5 class="text-warning mb-3">Datos del Gimnasio</h5>
                    <div class="mb-3">
                        <label class="small text-secondary">NOMBRE COMERCIAL</label>
                        <input type="text" id="set-gym-name" class="form-control">
                    </div>
                    <button class="btn btn-warning w-100 fw-bold" id="btn-save-name">GUARDAR CAMBIOS</button>
                </div>
            </div>

            <!-- 3. CREACIÓN DE USUARIOS -->
            <div class="col-md-6">
                <div class="config-card">
                    <div class="d-flex justify-content-between mb-3">
                        <h5 class="text-warning">Cuentas de Acceso</h5>
                        <button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#modalUser">+ Nuevo</button>
                    </div>
                    <table class="table table-dark table-sm align-middle">
                        <thead><tr class="small text-secondary"><th>Usuario</th><th>Rol</th><th></th></tr></thead>
                        <tbody id="tabla-usuarios"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVO USUARIO -->
    <div class="modal fade" id="modalUser" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content bg-dark border-secondary p-3">
            <form id="formNuevoUser">
                <h5 class="text-warning">Crear Nuevo Acceso</h5>
                <input type="text" id="new-user-name" class="form-control mb-2" placeholder="Usuario" required>
                <input type="password" id="new-user-pass" class="form-control mb-2" placeholder="Contraseña" required>
                <select id="new-user-rol" class="form-select mb-3">
                    <option value="propietario">Propietario (Dueño del Gym)</option>
                    <option value="admin">Administración (Recepcionista)</option>
                </select>
                <button type="submit" class="btn btn-warning w-100 fw-bold">CREAR USUARIO</button>
            </form>
        </div></div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, addDoc, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const rol = localStorage.getItem('rol');

        // SEGURIDAD: Solo Master ve esto
        if(rol === 'master') { document.getElementById('panel-richard').style.display = 'block'; }
        // SEGURIDAD: Recepcionista no entra aquí
        if(rol === 'admin') { window.location.href = "panel.html"; }

        // SINCRONIZAR NOMBRE
        onSnapshot(doc(db, "configuracion", "general"), (ds) => {
            if(ds.exists()) {
                document.getElementById('gym-name-side').innerText = ds.data().nombre;
                document.getElementById('set-gym-name').value = ds.data().nombre;
            }
        });

        document.getElementById('btn-save-name').addEventListener('click', async () => {
            await setDoc(doc(db, "configuracion", "general"), { nombre: document.getElementById('set-gym-name').value });
            alert("Nombre actualizado correctamente");
        });

        // GESTIÓN DE USUARIOS NUBE
        onSnapshot(collection(db, "system_users"), (snap) => {
            const tabla = document.getElementById('tabla-usuarios');
            tabla.innerHTML = "";
            snap.forEach(u => {
                const d = u.data();
                tabla.innerHTML += `<tr><td>${d.user}</td><td>${d.rol}</td><td class="text-end"><button class="btn btn-sm text-danger" onclick="borrarUser('${u.id}')"><i class="bi bi-trash"></i></button></td></tr>`;
            });
        });

        document.getElementById('formNuevoUser').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "system_users"), {
                user: document.getElementById('new-user-name').value.toLowerCase(),
                pass: document.getElementById('new-user-pass').value,
                rol: document.getElementById('new-user-rol').value
            });
            bootstrap.Modal.getInstance(document.getElementById('modalUser')).hide();
            e.target.reset();
        });

        window.borrarUser = async (id) => { if(confirm("¿Eliminar acceso?")) await deleteDoc(doc(db, "system_users", id)); };

        // FUNCIONES DE PODER RICHARD
        window.suspenderServicio = async () => {
            if(confirm("¿BLOQUEAR ESTE GIMNASIO?")) {
                await setDoc(doc(db, "configuracion", "general"), { nombre: "❌ SISTEMA SUSPENDIDO - CONTACTAR AL PROVEEDOR" });
                location.reload();
            }
        };

        window.activarServicio = async () => {
            const nombre = prompt("Nombre del Gym para activar:", "ROSLENNY GYM");
            if(nombre) {
                await setDoc(doc(db, "configuracion", "general"), { nombre: nombre });
                location.reload();
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
