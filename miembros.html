<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Miembros - Gym Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #f97316; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; }
        .sidebar { width: 260px; height: 100vh; background: var(--card-dark); position: fixed; border-right: 1px solid #334155; }
        .nav-link { color: #94a3b8; padding: 15px 25px; transition: 0.3s; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { background: #334155; color: var(--accent); border-left: 4px solid var(--accent); }
        .main-content { margin-left: 260px; padding: 30px; }
        .table-container { background: var(--card-dark); border-radius: 15px; padding: 20px; border: 1px solid #334155; }
        .modal-content { background: var(--card-dark); color: white; }
    </style>
</head>
<body>

    <div class="sidebar flex-column">
        <div class="p-4 text-center"><h4 style="color: var(--accent); font-weight: bold;">🏋️‍♂️ GYM MASTER</h4></div>
        <nav class="nav flex-column mt-3">
            <a class="nav-link" href="panel.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a class="nav-link active" href="miembros.html"><i class="bi bi-people me-2"></i> Miembros</a>
            <a class="nav-link" href="pagos.html"><i class="bi bi-cash-stack me-2"></i> Caja y Pagos</a>
            <a class="nav-link" href="asistencia.html"><i class="bi bi-calendar-check me-2"></i> Asistencia</a>
            <a class="nav-link" href="inventario.html"><i class="bi bi-box-seam me-2"></i> Inventario</a>
            <a class="nav-link text-danger mt-5" href="index.html"><i class="bi bi-box-arrow-left me-2"></i> Salir</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between mb-4">
            <h2>Gestión de Miembros</h2>
            <button class="btn btn-warning fw-bold" data-bs-toggle="modal" data-bs-target="#modalNuevoSocio">NUEVO SOCIO</button>
        </div>

        <div class="table-container">
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Membresía</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista-miembros">
                    <!-- Los socios se cargarán aquí dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal fade" id="modalNuevoSocio" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Registrar Socio</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="formSocio">
                        <div class="mb-3"><label>Nombre</label><input type="text" id="nombreSocio" class="form-control" required></div>
                        <div class="mb-3"><label>Teléfono</label><input type="text" id="telSocio" class="form-control"></div>
                        <div class="mb-3"><label>Plan</label>
                            <select id="planSocio" class="form-select"><option>Mensual</option><option>Anual</option></select>
                        </div>
                        <button type="submit" class="btn btn-warning w-100">GUARDAR</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // FUNCIÓN PARA CARGAR SOCIOS
        function cargarSocios() {
            const socios = JSON.parse(localStorage.getItem('socios')) || [];
            const tabla = document.getElementById('lista-miembros');
            tabla.innerHTML = "";

            socios.forEach((s, index) => {
                tabla.innerHTML += `
                    <tr>
                        <td>${s.nombre}</td>
                        <td>${s.telefono}</td>
                        <td>${s.plan}</td>
                        <td><span class="badge bg-success">Activo</span></td>
                        <td><button class="btn btn-sm btn-danger" onclick="eliminarSocio(${index})">Eliminar</button></td>
                    </tr>
                `;
            });
        }

        // GUARDAR NUEVO SOCIO
        document.getElementById('formSocio').onsubmit = function(e) {
            e.preventDefault();
            const nuevoSocio = {
                nombre: document.getElementById('nombreSocio').value,
                telefono: document.getElementById('telSocio').value,
                plan: document.getElementById('planSocio').value
            };

            const socios = JSON.parse(localStorage.getItem('socios')) || [];
            socios.push(nuevoSocio);
            localStorage.setItem('socios', JSON.stringify(socios));
            
            alert("Socio guardado!");
            location.reload(); // Refresca para ver los cambios
        };

        function eliminarSocio(index) {
            let socios = JSON.parse(localStorage.getItem('socios'));
            socios.splice(index, 1);
            localStorage.setItem('socios', JSON.stringify(socios));
            cargarSocios();
        }

        document.addEventListener("DOMContentLoaded", cargarSocios);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const config = JSON.parse(localStorage.getItem('gym_config')) || { name: "GYM MASTER" };
        const sideName = document.getElementById('gym-name-side');
        if(sideName) sideName.innerText = config.name;
    });
</script>
<!-- IMPORTANTE: type="module" permite usar la conexión -->
<script type="module">
    import { db } from './firebase-config.js';
    import { collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const tabla = document.getElementById('lista-miembros');

    // 1. CARGAR SOCIOS DESDE FIREBASE EN TIEMPO REAL
    onSnapshot(collection(db, "socios"), (querySnapshot) => {
        tabla.innerHTML = "";
        querySnapshot.forEach((s) => {
            const data = s.data();
            tabla.innerHTML += `
                <tr>
                    <td>${data.nombre}</td>
                    <td>${data.telefono}</td>
                    <td>${data.plan}</td>
                    <td><span class="badge bg-success">Activo</span></td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="eliminarSocioCloud('${s.id}')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        });
    });

    // 2. GUARDAR NUEVO SOCIO EN LA NUBE
    document.getElementById('formSocio').onsubmit = async function(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;

        try {
            await addDoc(collection(db, "socios"), {
                nombre: document.getElementById('nombreSocio').value,
                telefono: document.getElementById('telSocio').value,
                plan: document.getElementById('planSocio').value,
                fechaCreado: new Date()
            });
            
            // Cerrar el modal (Bootstrap)
            const modal = bootstrap.Modal.getInstance(document.getElementById('modalNuevoSocio'));
            modal.hide();
            e.target.reset();
        } catch (error) {
            alert("Error: " + error.message);
        } finally { btn.disabled = false; }
    };

    // 3. FUNCIÓN ELIMINAR (Hacerla global)
    window.eliminarSocioCloud = async function(id) {
        if(confirm("¿Seguro que deseas eliminar este socio de la nube?")) {
            await deleteDoc(doc(db, "socios", id));
        }
    };
</script>

        document.addEventListener("DOMContentLoaded", function() {
            const rol = localStorage.getItem('rol');

            // Seleccionamos los botones del menú lateral
            const btnConfig = document.querySelector('a[href="usuarios.html"]');
            const btnInformes = document.querySelector('a[href="informes.html"]');

            // LÓGICA DE PODER:
            // 1. Si NO eres Richard (Master), se oculta Configuración
            if (rol !== 'master') {
                if (btnConfig) btnConfig.style.display = 'none';
            }

            // 2. Si eres el Recepcionista (admin), se ocultan los Informes de dinero
            if (rol === 'admin') {
                if (btnInformes) btnInformes.style.display = 'none';
            }
        });
    </script>
